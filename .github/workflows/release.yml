name: Release

# Builds the Tauri app on every tag push for macOS, Windows and Ubuntu/Linux
# and attaches the bundles (DMG / NSIS installer / deb+AppImage) to a GitHub
# Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      # Nur was ueber das workflow-weite contents: read hinausgeht.
      # Read-Rechte hier zu wiederholen ist das, was OpenSSF Scorecard
      # als zu weite Token-Berechtigung bemaengelt.
      contents: write
      # Signed build provenance for the downloads (Sigstore through GitHub).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LifeSort ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details. Not code-signed/notarized: macOS Gatekeeper and Windows SmartScreen will show warnings on first run.'
          releaseDraft: false
          prerelease: false

      - name: Upload stable-named DMG (for README download link)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find target/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$dmg" LifeSort.dmg
          gh release upload "${{ github.ref_name }}" LifeSort.dmg --clobber --repo ${{ github.repository }}

      # Signed provenance: proves the file was built from this commit by this
      # workflow. Uploaded next to it, where `gh attestation verify` and the
      # OpenSSF Scorecard find it.
      - name: Attest LifeSort.dmg
        if: matrix.platform == 'macos-latest'
        id: attest_LifeSort_dmg
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: LifeSort.dmg

      - name: Upload provenance for LifeSort.dmg
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest_LifeSort_dmg.outputs.bundle-path }}" "LifeSort.dmg.sigstore.json"
          gh release upload "${{ github.ref_name }}" "LifeSort.dmg.sigstore.json" --clobber --repo ${{ github.repository }}

      - name: Upload stable-named installer (for README download link)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "LifeSort-Setup.exe"
          gh release upload "${{ github.ref_name }}" "LifeSort-Setup.exe" --clobber --repo ${{ github.repository }}

      # Signed provenance: proves the file was built from this commit by this
      # workflow. Uploaded next to it, where `gh attestation verify` and the
      # OpenSSF Scorecard find it.
      - name: Attest LifeSort-Setup.exe
        if: matrix.platform == 'windows-latest'
        id: attest_LifeSort_Setup_exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: LifeSort-Setup.exe

      - name: Upload provenance for LifeSort-Setup.exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest_LifeSort_Setup_exe.outputs.bundle-path }}" "LifeSort-Setup.exe.sigstore.json"
          gh release upload "${{ github.ref_name }}" "LifeSort-Setup.exe.sigstore.json" --clobber --repo ${{ github.repository }}

      - name: Upload stable-named AppImage (for README download link)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(find target/release/bundle/appimage -name "*.AppImage" | head -1)
          cp "$appimage" LifeSort.AppImage
          gh release upload "${{ github.ref_name }}" LifeSort.AppImage --clobber --repo ${{ github.repository }}

      # Signed provenance: proves the file was built from this commit by this
      # workflow. Uploaded next to it, where `gh attestation verify` and the
      # OpenSSF Scorecard find it.
      - name: Attest LifeSort.AppImage
        if: matrix.platform == 'ubuntu-latest'
        id: attest_LifeSort_AppImage
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: LifeSort.AppImage

      - name: Upload provenance for LifeSort.AppImage
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest_LifeSort_AppImage.outputs.bundle-path }}" "LifeSort.AppImage.sigstore.json"
          gh release upload "${{ github.ref_name }}" "LifeSort.AppImage.sigstore.json" --clobber --repo ${{ github.repository }}
